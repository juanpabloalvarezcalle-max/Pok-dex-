<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <header>
      <div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary navBarText">
          <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">Pokédex</a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a
                    class="nav-link active"
                    aria-current="page"
                    href="/index.html"
                    >Inicio</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/docs/primeraGeneracion.html"
                    >Primera Generación</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/docs/terceraGeneración.html"
                    >Tercera Generación</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/docs/sextaGeneración.html"
                    >Sexta Generación</a
                  >
                </li>
              </ul>
              <button class="btn btn-outline-danger btn-sm rounded-pill ms-lg-auto my-1 fw-bold d-inline-flex align-items-center gap-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasEquipo">
                <span>🎒</span> Mi Equipo
              </button>
            </div>
          </div>
        </nav>
      </div>
    </header>
    <main class="container my-4 d-flex justify-content-center">
      <!-- Tarjeta principal centrada, similar al mockup -->
      <div class="card p-4 rounded-4 shadow border-0" style="max-width: 420px; width: 100%;">
        
        <!-- Barra superior: Botón volver, título y estrella -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 34px; height: 34px;" title="Volver">
            &larr;
          </a>
          <h4 class="m-0 fw-bold" id="pokeTitulo">Detalle Pokémon</h4>
          <span class="fs-4 text-warning" role="button" title="Favorito">&#9733;</span>
        </div>

        <!-- Zona de la foto con botones Anterior (<) y Siguiente (>) -->
        <div class="d-flex justify-content-between align-items-center my-3">
          <button id="btnAnterior" class="btn btn-light rounded-circle shadow-sm fw-bold" type="button" style="width: 38px; height: 38px;" title="Anterior">&lt;</button>
          
          <!-- Círculo de fondo con la foto del Pokémon -->
          <div class="pokemon-detalle-img-wrapper d-flex justify-content-center align-items-center mx-auto">
            <img id="pokeImagen" src="" alt="Foto Pokémon" style="width: 130px; height: 130px; object-fit: contain;" />
          </div>

          <button id="btnSiguiente" class="btn btn-light rounded-circle shadow-sm fw-bold" type="button" style="width: 38px; height: 38px;" title="Siguiente">&gt;</button>
        </div>

        <!-- Información y acciones del Pokémon -->
        <div class="text-center mt-2">
          
          <!-- Número y Nombre -->
          <h2 class="fw-bold mb-2">
            <span class="text-secondary" id="pokeNumero">#000</span>
            <span id="pokeNombre">Cargando...</span>
          </h2>

          <!-- Tipos del Pokémon (Badges) -->
          <div id="pokeTipos" class="d-flex justify-content-center gap-2 mb-3">
            <span class="badge bg-secondary px-3 py-2 rounded-pill">Tipo</span>
          </div>

          <!-- Descripción del Pokémon -->
          <p id="pokeDescripcion" class="text-muted px-2" style="font-size: 0.95rem;">
            Descripción del pokémon...
          </p>

          <!-- Selector Normal / Shiny -->
          <div class="btn-group w-100 my-2" role="group">
            <button type="button" id="btnNormal" class="btn btn-outline-primary active">Normal</button>
            <button type="button" id="btnShiny" class="btn btn-outline-primary">Shiny</button>
          </div>

          <!-- Botón de sonido (Grito) -->
          <button id="btnAudio" type="button" class="btn btn-light border w-100 my-2 py-2 fw-semibold text-primary d-flex justify-content-center align-items-center gap-2">
            <span>🔊</span> Escuchar grito
          </button>

          <!-- Botón de añadir al equipo -->
          <button id="btnEquipo" type="button" class="btn btn-primary w-100 py-2 mt-2 fw-bold d-flex justify-content-center align-items-center gap-2">
            <span>➕</span> Añadir al equipo
          </button>
        </div>
                <br>
      </div>
    </main>
    <footer></footer>

    <!-- Offcanvas (Panel lateral desplegable) para Mi Equipo Pokémon -->
    <div class="offcanvas offcanvas-end rounded-start-4" tabindex="-1" id="offcanvasEquipo" aria-labelledby="offcanvasEquipoLabel">
      <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold d-flex align-items-center gap-2" id="offcanvasEquipoLabel">
          <span>🎒</span> Mi Equipo Pokémon
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <p class="text-muted small">Puedes tener hasta 6 Pokémon en tu equipo oficial.</p>
        <div id="listaEquipo" class="d-flex flex-column gap-2"></div>
        <button id="btnVaciarEquipo" class="btn btn-outline-danger btn-sm w-100 mt-4 rounded-pill">
          Vaciar equipo
        </button>
      </div>
    </div>

    <script src="/scripts/pokemonDetalle.js"></script> 
  </body>
</html>
