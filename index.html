<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
<div class="rojo"></div>
    <header>
      <div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary navBarText">
          <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">Pokédex</a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a
                    class="nav-link active"
                    aria-current="page"
                    href="/index.html"
                    >Inicio</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/docs/primeraGeneracion.html"
                    >Primera Generación</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/docs/terceraGeneración.html"
                    >Tercera Generación</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/docs/sextaGeneración.html"
                    >Sexta Generación</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
      <!-- Banner superior (Logo, lema y pokebola) -->
      <div class="contenedorHeaderHome">
        <img class="logoPokedexImg" src="/imgs/logoPokedex.png" alt="FotoNombrePokedex" />
        <div class="cardHome">
          <h1 class="h1Home">¡Atrápalos a todos!</h1>
        </div>
        <img class="pokebolaLogo" src="/imgs/LogoPokebola.png" alt="FotoPokebola" />
      </div>

      <!-- Buscador independiente, centrado y responsivo -->
      <div class="container my-3 px-3">
        <div class="seccion-buscador col-11 col-md-8 col-lg-6 rounded-5 mx-auto">
          <h2 class="titulo-buscador">Busca a tu Pokémon favorito</h2>
          <div class="buscador">
            <input type="text" id="input" placeholder="Nombre o número..." autocomplete="off" />
            <button id="btn" aria-label="Buscar Pokémon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; min-width: 16px; max-width: 16px; flex-shrink: 0; display: inline-block;">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <span>Buscar</span>
            </button>
          </div>

          <p id="mensaje">Buscar un pokemon para comenzar</p> 

          <div class="card pokemon-resultado" id="card">
            <div class="pokemon-img-wrapper">
              <img id="imagen" alt="Imagen Pokemon" />
            </div>
            <p class="nombre" id="nombre"></p>
            <span class="tipo" id="tipo">...</span>
          </div>  
        </div> 
      </div>

      <!-- Título de sección generaciones -->
      <div class="container d-flex justify-content-center my-3 px-3">
        <div class="cardHome">
          <h2 class="textChooseGeneration">Elige una generación</h2>
        </div>
      </div>
    </header>

    <main class="contenedorGeneraciones container px-3">
      <div class="card col-11 col-md-8 col-lg-6 mb-3 rounded-5 mx-auto cardKanto">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title">Primera Generación</h5>
            <p class="card-text">(Kanto)</p>
          </div>
          <a href="/docs/primeraGeneracion.html" class="btn btn-primary rounded-pill buttonCard">Ir</a>
        </div>
      </div>

      <div class="card col-11 col-md-8 col-lg-6 mb-3 rounded-5 mx-auto cardHoenn">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title">Tercera Generación</h5>
            <p class="card-text">(Hoenn)</p>
          </div>
          <a href="/docs/terceraGeneración.html" class="btn btn-primary rounded-pill buttonCard">Ir</a>
        </div>
      </div>

      <div class="card col-11 col-md-8 col-lg-6 mb-3 rounded-5 mx-auto cardKalos">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title">Sexta Generación</h5>
            <p class="card-text">(Kalos)</p>
          </div>
          <a href="/docs/sextaGeneración.html" class="btn btn-primary rounded-pill buttonCard">Ir</a>
        </div>
      </div>
      
      
    </main>
    <footer></footer>

    <script src="/scripts/scripts.js"></script>
    <script src="/scripts/buscador.js"></script>
  </body>
</html>
